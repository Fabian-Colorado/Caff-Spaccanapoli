<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- FLOATING MENU -->

    <a href="menu.html"
       class="floating-menu"
       data-en="MENU"
       data-es="MENÚ">
    </a>


    <!-- HEADER -->

    <header>

        <nav>

            <a href="index.html" class="site-name">
                NAME
            </a>

<div class="language-selector">

    <button data-language="it">
        Italiano
    </button>

    <button data-language="en">
        English
    </button>

    <button data-language="es">
        Español
    </button>

</div>
        </nav>

    </header>


    <!-- HERO -->

<section class="hero">
    <div class="hero-content">
        <p data-it="NAPOLI, ITALIA"
           data-en="NAPLES, ITALY"
           data-es="NÁPOLES, ITALIA">
            NAPOLI, ITALIA
        </p>

        <h1>CAFFÈ SPACCANAPOLI</h1>

        <p data-it="Caffè e pasticceria nel cuore di Napoli."
           data-en="Coffee and pastry in the heart of Naples."
           data-es="Café y pastelería en el corazón de Nápoles.">
            Caffè e pasticceria nel cuore di Napoli.
        </p>

        <a href="menu.html"
           data-it="SCOPRI IL MENÙ"
           data-en="DISCOVER THE MENU"
           data-es="DESCUBRE EL MENÚ">
            SCOPRI IL MENÙ
        </a>
    </div>
</section>


    <!-- ABOUT -->

    <section class="intro">

        <div class="intro-content">

            <p class="section-label"
               data-en="ABOUT"
               data-es="SOBRE">
            </p>

            <h2
                data-en="A short statement about the business."
                data-es="Una frase breve sobre el negocio.">
            </h2>

            <p
                data-en="A longer description about the business, its atmosphere, history or concept."
                data-es="Una descripción más amplia sobre el negocio, su ambiente, historia o concepto.">
            </p>

        </div>

    </section>


    <!-- GALLERY -->

    <section class="gallery">

        <div class="gallery-window">

            <div class="gallery-track">

                <img src="images/1.png" alt="">

                <img src="images/2.png" alt="">

                <img src="images/3.png" alt="">

                <img src="images/4.png" alt="">

                <img src="images/5.png" alt="">

                <img src="images/6.png" alt="">

                <img src="images/7.png" alt="">

                <img src="images/8.png" alt="">

                <img src="images/9.png" alt="">

                <img src="images/10.png" alt="">

                <img src="images/11.png" alt="">

                <img src="images/12.png" alt="">

            </div>

        </div>


        <div class="gallery-controls">

            <button id="previous">
                ←
            </button>

            <span class="gallery-counter">

                <span id="current-number">
                    1
                </span>

                /

                12

            </span>

            <button id="next">
                →
            </button>

        </div>

    </section>


    <!-- LOCATION -->

    <section class="location">

        <div class="location-content">

            <p class="section-label"
               data-en="LOCATION"
               data-es="UBICACIÓN">
            </p>

            <h2
                data-en="City"
                data-es="Ciudad">
            </h2>

            <p>
                Address<br>
                City, Country<br>
                Postal Code
            </p>

            <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="location-button"
                data-en="VIEW ON GOOGLE MAPS"
                data-es="VER EN GOOGLE MAPS">
            </a>

        </div>

    </section>


    <!-- SOCIAL -->

    <section class="instagram">

        <div class="instagram-content">

            <p class="section-label"
               data-en="SOCIAL"
               data-es="REDES SOCIALES">
            </p>

            <h2>
                Instagram
            </h2>

            <p
                data-en="Photos and updates on Instagram."
                data-es="Fotos y novedades en Instagram.">
            </p>

            <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-button">
                @username →
            </a>

        </div>

    </section>


    <script src="script.js" defer></script>

</body>

</html>
