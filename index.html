<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- FLOATING MENU -->

    <a href="menu.html"
       class="floating-menu"
       data-en="MENU"
       data-es="MENÚ">
    </a>


    <!-- HEADER -->

    <header>

        <nav>

            <a href="index.html" class="site-name">
                NAME
            </a>

<div class="language-selector">

    <button data-language="it">
        Italiano
    </button>

    <button data-language="en">
        English
    </button>

    <button data-language="es">
        Español
    </button>

</div>
        </nav>

    </header>


    <!-- HERO -->

<section class="hero">
    <div class="hero-content">
        <p data-it="NAPOLI, ITALIA"
           data-en="NAPLES, ITALY"
           data-es="NÁPOLES, ITALIA">
            NAPOLI, ITALIA
        </p>

        <h1>CAFFÈ SPACCANAPOLI</h1>

        <p data-it="Caffè e pasticceria nel cuore di Napoli."
           data-en="Coffee and pastry in the heart of Naples."
           data-es="Café y pastelería en el corazón de Nápoles.">
            Caffè e pasticceria nel cuore di Napoli.
        </p>

    </div>
</section>


<!-- BUSINESS / LOCATION -->
<section class="business-location">

    <div class="business-location-overlay">

        <p class="section-label"
           data-it="NEL CUORE DI NAPOLI"
           data-en="IN THE HEART OF NAPLES"
           data-es="EN EL CORAZÓN DE NÁPOLES">
        </p>

        <h2
            data-it="Caffè e pasticceria"
            data-en="Coffee and pastry"
            data-es="Café y pastelería">
        </h2>

        <p
            data-it="Nel cuore di Napoli, in Via Duomo."
            data-en="In the heart of Naples, on Via Duomo."
            data-es="En el corazón de Nápoles, en Via Duomo.">
        </p>

        <p class="location-address">
            Via Duomo, 87<br>
            80138 Napoli NA, Italia
        </p>

        <a href="https://maps.app.goo.gl/TSne2kQauADsRzyU7"
           target="_blank"
           rel="noopener noreferrer"
           class="location-button"
           data-it="VEDI SU GOOGLE MAPS"
           data-en="VIEW ON GOOGLE MAPS"
           data-es="VER EN GOOGLE MAPS">
        </a>

    </div>

</section>
    <!-- GALLERY -->

<section class="gallery-section">

    <div class="gallery">

        <div class="gallery-track">

            <div class="gallery-item">
                <img src="images/3.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/4.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/5.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/6.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/7.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/8.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/9.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/10.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/11.png" alt="Caffè Spaccanapoli">
            </div>

            <div class="gallery-item">
                <img src="images/12.png" alt="Caffè Spaccanapoli">
            </div>

        </div>

        <div class="gallery-controls">

            <button id="prev-button">←</button>

            <span id="gallery-counter">1 / 10</span>

            <button id="next-button">→</button>

        </div>

    </div>

</section>


    <!-- LOCATION -->

    <section class="location">

        <div class="location-content">

            <p class="section-label"
               data-en="LOCATION"
               data-es="UBICACIÓN">
            </p>

            <h2
                data-en="City"
                data-es="Ciudad">
            </h2>

            <p>
                Address<br>
                City, Country<br>
                Postal Code
            </p>

            <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="location-button"
                data-en="VIEW ON GOOGLE MAPS"
                data-es="VER EN GOOGLE MAPS">
            </a>

        </div>

    </section>


    <!-- SOCIAL -->

    <section class="instagram">

        <div class="instagram-content">

            <p class="section-label"
               data-en="SOCIAL"
               data-es="REDES SOCIALES">
            </p>

            <h2>
                Instagram
            </h2>

            <p
                data-en="Photos and updates on Instagram."
                data-es="Fotos y novedades en Instagram.">
            </p>

            <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram-button">
                @username →
            </a>

        </div>

    </section>


    <script src="script.js" defer></script>

</body>

</html>
